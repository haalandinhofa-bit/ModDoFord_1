name: Build Elemental Combat 1.20.1
on:
  push:
    branches: [ elemental-combat-1.20.1 ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Elemental Combat
        working-directory: elemental-combat
        run: gradle build --no-daemon
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: elemental-combat-1.20.1
          path: elemental-combat/build/libs/*.jar
          if-no-files-found: error
